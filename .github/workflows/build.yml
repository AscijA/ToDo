name: Build and Validate MAUI Apps

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call: # Crucial: Allows the release workflow to call this as a function
    inputs:
      explicit_version:
        type: string
        required: false
        default: ''

jobs:
  # ==========================================
  # WINDOWS BUILD TRACK
  # ==========================================
  build-windows:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Windows/ToDo.Maui.Windows.csproj
      Wap_Project_Directory: ToDo.Maui.Windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Windows Workload
      run: dotnet workload install maui-windows

    - name: Calculate Semantic Version
      uses: dotnet/nbgv@master
      id: nbgv

    # Figures out whether to use the manual release version or the git height fallback version
    - name: Resolve Versioning Variables
      shell: powershell
      id: version_resolver
      run: |
        $version = "${{ inputs.explicit_version }}"
        if ([string]::IsNullOrEmpty($version)) { $version = "${{ steps.nbgv.outputs.SimpleVersion }}" }
        echo "final_version=$version" >> $env:GITHUB_OUTPUT

    - name: Dynamically Patch AppxManifest Version
      shell: powershell
      run: |
        $manifestPath = "${{ env.Wap_Project_Directory }}/Platforms/Windows/Package.appxmanifest"
        $targetVersion = "${{ steps.version_resolver.outputs.final_version }}.0"
        
        # Safe .NET native read to preserve exact original file layout, encoding, and tokens
        $rawText = [System.IO.File]::ReadAllText($manifestPath)
        
        # Regex using a lookbehind to modify ONLY the characters inside the Identity's Version="X.X.X.X" property quotes
        $updatedText = $rawText -replace '(?<=<Identity[^>]+Version=")[^"]*', $targetVersion
        
        # Safe .NET native write back to disk to preserve the exact byte structure
        [System.IO.File]::WriteAllText($manifestPath, $updatedText)
        Write-Host "Successfully patched Package.appxmanifest identity field to: $targetVersion"

    - name: Decode the PFX
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath PermanentSigningCert.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Compile MAUI Windows App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:SEMVER="${{ steps.version_resolver.outputs.final_version }}" -p:BUILD_NUMBER=${{ github.run_number }} -p:AppxPackageVersion="${{ steps.version_resolver.outputs.final_version }}.0"

    - name: Sign MSIX Package via SignTool
      shell: powershell
      run: |
        $packageRoots = @(
          "${{ env.Wap_Project_Directory }}/AppPackages",
          "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages",
          "${{ env.Wap_Project_Directory }}/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages"
        ) | Where-Object { Test-Path $_ }

        if (-not $packageRoots) {
          throw "Could not find any AppPackages output directory under ${{ env.Wap_Project_Directory }}."
        }

        $msixFile = Get-ChildItem -Path $packageRoots -Recurse -Include *.msixbundle,*.msix |
          Sort-Object LastWriteTime -Descending |
          Select-Object -First 1

        if (-not $msixFile) { throw "Could not find any compiled .msixbundle or .msix file to sign." }

        $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
        & $signTool.FullName sign /f "${{ env.Wap_Project_Directory }}\PermanentSigningCert.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 /v $msixFile.FullName
        Copy-Item -Path $msixFile.FullName -Destination "./ToDo-Windows-v${{ steps.version_resolver.outputs.final_version }}$($msixFile.Extension)"

    - name: Remove the PFX
      run: Remove-Item -path $env:Wap_Project_Directory\PermanentSigningCert.pfx -Force

    - name: Upload Windows Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: ./ToDo-Windows-v${{ steps.version_resolver.outputs.final_version }}.*

  # ==========================================
  # ANDROID BUILD TRACK
  # ==========================================
  build-android:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Android/ToDo.Maui.Android.csproj
      Wap_Project_Directory: ToDo.Maui.Android
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Android Workload
      run: dotnet workload install maui-android

    - name: Calculate Semantic Version
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Resolve Versioning Variables
      shell: powershell
      id: version_resolver
      run: |
        $version = "${{ inputs.explicit_version }}"
        if ([string]::IsNullOrEmpty($version)) { $version = "${{ steps.nbgv.outputs.SimpleVersion }}" }
        echo "final_version=$version" >> $env:GITHUB_OUTPUT

    - name: Decode the Keystore
      run: |
        $keystore_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Keystore }}")
        $keystorePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath todo.keystore
        [IO.File]::WriteAllBytes("$keystorePath", $keystore_byte)

    # FIXED: Corrected syntax token from $version_resolver to steps.version_resolver.outputs.final_version
    - name: Publish MAUI Android App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-android -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=todo.keystore -p:AndroidSigningKeyAlias="todo_alias" -p:AndroidSigningKeyPass="${{ secrets.Pfx_Key }}" -p:AndroidSigningStorePass="${{ secrets.Pfx_Key }}" -p:SEMVER="${{ steps.version_resolver.outputs.final_version }}" -p:BUILD_NUMBER=${{ github.run_number }}

    - name: Locate and Stage Android APK
      shell: powershell
      run: |
        $apkFile = Get-ChildItem -Path "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-android/publish/*-signed.apk" -Recurse | Select-Object -First 1
        if (-not $apkFile) { throw "Could not find signed APK." }
        Copy-Item -Path $apkFile.FullName -Destination "./ToDo-Android-v${{ steps.version_resolver.outputs.final_version }}.apk"

    - name: Remove the Keystore
      run: Remove-Item -path ${{ env.Wap_Project_Directory }}\todo.keystore -Force

    - name: Upload Android Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: android-binary
        path: ./ToDo-Android-v${{ steps.version_resolver.outputs.final_version }}.apk
