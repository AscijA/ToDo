name: .NET 10 MAUI Windows CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: ToDo.slnx
      Project_Path: ToDo.Maui.Windows/ToDo.Maui.Windows.csproj
      Wap_Project_Directory: ToDo.Maui.Windows
      BASE_VERSION: "1.0"

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Decode your permanent PFX from secrets onto the runner
    - name: Decode the PFX
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath PermanentSigningCert.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Build the package *without* letting MSBuild touch the signing logic
    - name: Compile MAUI Windows App
      run: dotnet publish ${{ env.Project_Path }} -c ${{ matrix.configuration }} -f net10.0-windows10.0.19041.0 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:ApplicationDisplayVersion="${{ env.BASE_VERSION }}.${{ github.run_number }}" -p:ApplicationVersion=${{ github.run_number }}

    # Locate and sign the compiled .msix bundle directly via SignTool
    - name: Sign MSIX Package via SignTool
      shell: powershell
      run: |
        # Find the generated installer package
        $msixFile = Get-ChildItem -Path "**/AppPackages/**/*.msix" -Recurse | Select-Object -First 1
        if (-not $msixFile) { throw "Could not find any compiled .msix file to sign." }
        
        Write-Host "Found target bundle: $($msixFile.FullName)"
        
        # Locate the Windows SDK SignTool executable on the GitHub runner
        $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
        if (-not $signTool) { throw "SignTool.exe could not be located on this runner." }
        
        # Execute production file signing explicitly
        & $signTool.FullName sign /f "${{ env.Wap_Project_Directory }}\PermanentSigningCert.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 /v $msixFile.FullName

    # Clean up the PFX file immediately after signing
    - name: Remove the PFX
      run: Remove-Item -path $env:Wap_Project_Directory\PermanentSigningCert.pfx -Force

    - name: Upload Packaged Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ToDo-Windows-App-Build-${{ github.run_number }}
        path: "**/AppPackages/**"
