name: Release MAUI Apps

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Enter targeted version number (e.g. 1.0.13)'
        required: true
        default: '1.0.13'
      build_number:
        description: 'Internal sequential build integer (e.g. 13)'
        required: true
        default: '13'

permissions:
  contents: write

jobs:
  # 1. Reuse the build script to compile and sign both platforms
  trigger-shared-builds:
    uses: ./.github/workflows/build-only.yml
    with:
      explicit_version: ${{ github.event.inputs.release_version }}
      explicit_build_number: ${{ github.event.inputs.build_number }}
    secrets: inherit # Automatically passes Pfx_Key and secret properties over safely

  # 2. Package and publish the outputs once the compilation job resolves green
  create-release:
    runs-on: ubuntu-latest
    needs: trigger-shared-builds
    steps:
    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-binary
        path: ./release-assets

    - name: Download Android Binary
      uses: actions/download-artifact@v4
      with:
        name: android-binary
        path: ./release-assets

    - name: Generate Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ github.event.inputs.release_version }}
        name: Build Release v${{ github.event.inputs.release_version }}
        body: |
          ### Production Build Release v${{ github.event.inputs.release_version }}
          
          * **Windows Installer:** `ToDo-Windows-v${{ github.event.inputs.release_version }}.msix`
          * **Android Installer:** `ToDo-Android-v${{ github.event.inputs.release_version }}.apk`
        draft: false
        prerelease: false
        files: |
          ./release-assets/ToDo-Windows-v*.msix
          ./release-assets/ToDo-Android-v*.apk
