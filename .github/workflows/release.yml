name: Manual Production Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional explicit version, for example 1.3.0. Leave empty to bump the latest vX.Y.Z tag.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.bump.outputs.next }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Resolve Release Version
      id: bump
      run: |
        REQUESTED_VERSION="${{ inputs.release_version }}"

        if [ -n "$REQUESTED_VERSION" ]; then
          CLEAN_VERSION="${REQUESTED_VERSION#v}"
          if ! echo "$CLEAN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid release_version '$REQUESTED_VERSION'. Expected X.Y.Z or vX.Y.Z." >&2
            exit 1
          fi
          NEXT_VERSION="$CLEAN_VERSION"
        else
          RAW_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$RAW_TAG" ]; then RAW_TAG="v1.0.0"; fi
          CLEAN_TAG=${RAW_TAG#v}

          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)

          NEXT_MINOR=$((MINOR + 1))
          NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
        fi

        if git rev-parse "v$NEXT_VERSION" >/dev/null 2>&1; then
          echo "Refusing to overwrite existing release tag v$NEXT_VERSION." >&2
          exit 1
        fi

        echo "Resolved release version: $NEXT_VERSION"
        echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT

  # CHANGED: Reuses the newly named build.yml file as the template function engine
  trigger-shared-builds:
    needs: calculate-version
    uses: ./.github/workflows/build.yml
    with:
      explicit_version: ${{ needs.calculate-version.outputs.next_version }}
    secrets: inherit

  create-release:
    runs-on: ubuntu-latest
    needs: [calculate-version, trigger-shared-builds]
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-binary
        path: ./release-assets

    - name: Download Android Binary
      uses: actions/download-artifact@v4
      with:
        name: android-binary
        path: ./release-assets

    - name: Ensure Release Tag Does Not Exist
      run: |
        if git ls-remote --exit-code --tags origin "v${{ needs.calculate-version.outputs.next_version }}" >/dev/null 2>&1; then
          echo "Release tag v${{ needs.calculate-version.outputs.next_version }} already exists. Refusing to update an existing release." >&2
          exit 1
        fi

    - name: Create Production Tag and Release Entry
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.calculate-version.outputs.next_version }}
        name: Build Release v${{ needs.calculate-version.outputs.next_version }}
        body: |
          ### Production Build Release v${{ needs.calculate-version.outputs.next_version }}
          This deployment automatically increments the Minor build version tracking index.
          
          * **Windows Installer:** `ToDo-Windows-v${{ needs.calculate-version.outputs.next_version }}.msix`
          * **Android Installer:** `ToDo-Android-v${{ needs.calculate-version.outputs.next_version }}.apk`
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          ./release-assets/ToDo-Windows-v*.msix
          ./release-assets/ToDo-Android-v*.apk
