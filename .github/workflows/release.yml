name: Build and Auto-Release MAUI Apps

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: # ◄ Allows you to trigger this entire pipeline manually whenever you want

# Grants the workflow secure write permissions to publish releases automatically
permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD WINDOWS (MSIX)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Windows/ToDo.Maui.Windows.csproj
      Wap_Project_Directory: ToDo.Maui.Windows
      BASE_VERSION: "1.0"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Decode the PFX
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath PermanentSigningCert.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Compile MAUI Windows App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:ApplicationDisplayVersion="${{ env.BASE_VERSION }}.${{ github.run_number }}" -p:ApplicationVersion=${{ github.run_number }}

    - name: Sign MSIX Package via SignTool
      shell: powershell
      run: |
        $msixFile = Get-ChildItem -Path "**/AppPackages/**/*.msix" -Recurse | Select-Object -First 1
        if (-not $msixFile) { throw "Could not find any compiled .msix file to sign." }
        $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
        & $signTool.FullName sign /f "${{ env.Wap_Project_Directory }}\PermanentSigningCert.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 /v $msixFile.FullName
        # Make a copy of the MSIX out into the root workspace for easy collection later
        Copy-Item -Path $msixFile.FullName -Destination "./ToDo-Windows.msix"

    - name: Remove the PFX
      run: Remove-Item -path $env:Wap_Project_Directory\PermanentSigningCert.pfx -Force

    # Temporarily pass the signed installer over to the release job
    - name: Upload Windows Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: ./ToDo-Windows.msix

  # ==========================================
  # JOB 2: BUILD ANDROID (APK)
  # ==========================================
  build-android:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Android/ToDo.Maui.Android.csproj
      Wap_Project_Directory: ToDo.Maui.Android
      BASE_VERSION: "1.0"
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Decode the Keystore
      run: |
        $keystore_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Keystore }}")
        $keystorePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath todo.keystore
        [IO.File]::WriteAllBytes("$keystorePath", $keystore_byte)

    - name: Publish MAUI Android App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-android -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=todo.keystore -p:AndroidSigningKeyAlias="todo_alias" -p:AndroidSigningKeyPass="${{ secrets.Pfx_Key }}" -p:AndroidSigningStorePass="${{ secrets.Pfx_Key }}" -p:ApplicationDisplayVersion="${{ env.BASE_VERSION }}.${{ github.run_number }}" -p:ApplicationVersion=${{ github.run_number }}

    - name: Locate and Stage Android APK
      shell: powershell
      run: |
        $apkFile = Get-ChildItem -Path "**/bin/Release/net10.0-android/publish/*-signed.apk" -Recurse | Select-Object -First 1
        if (-not $apkFile) { throw "Could not find signed APK." }
        Copy-Item -Path $apkFile.FullName -Destination "./ToDo-Android.apk"

    - name: Remove the Keystore
      run: Remove-Item -path ${{ env.Wap_Project_Directory }}\todo.keystore -Force

    # Temporarily pass the signed APK over to the release job
    - name: Upload Android Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: android-binary
        path: ./ToDo-Android.apk

  # ==========================================
  # JOB 3: MERGE ARTIFACTS & CREATE RELEASE
  # ==========================================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android] # Ensures this only runs if BOTH compilations pass
    steps:
    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-binary
        path: ./release-assets

    - name: Download Android Binary
      uses: actions/download-artifact@v4
      with:
        name: android-binary
        path: ./release-assets

    - name: Generate Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Build Release v1.0.${{ github.run_number }}
        body: |
          ### Automated Mobile and Desktop Build
          This release contains the latest cross-platform build distributions for your project.
          
          * **Windows Installer:** `ToDo-Windows.msix`
          * **Android Installer:** `ToDo-Android.apk`
        draft: false
        prerelease: false
        files: |
          ./release-assets/ToDo-Windows.msix
          ./release-assets/ToDo-Android.apk
