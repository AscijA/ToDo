name: Build and Auto-Release MAUI Apps

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: BUILD & SIGN WINDOWS (MSIX)
  # ==========================================
  build-windows:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Windows/ToDo.Maui.Windows.csproj
      Wap_Project_Directory: ToDo.Maui.Windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # CRITICAL: SemVer tools require the full history graph to calculate versions

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Calculate Semantic Version dynamically from your Git commits
    - name: Calculate Semantic Version
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Decode the PFX
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath PermanentSigningCert.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    # Pass the extracted SemVer string properties cleanly into the compiler flags
    - name: Compile MAUI Windows App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:SEMVER="${{ steps.nbgv.outputs.SimpleVersion }}" -p:BUILD_NUMBER=${{ steps.nbgv.outputs.GitCommitIdHeight }}

    - name: Sign MSIX Package via SignTool
      shell: powershell
      run: |
        $msixFile = Get-ChildItem -Path "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages/**/*.msix" -Recurse | Select-Object -First 1
        if (-not $msixFile) { throw "Could not find any compiled .msix file to sign." }
        $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
        & $signTool.FullName sign /f "${{ env.Wap_Project_Directory }}\PermanentSigningCert.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 /v $msixFile.FullName
        Copy-Item -Path $msixFile.FullName -Destination "./ToDo-Windows.msix"

    - name: Remove the PFX
      run: Remove-Item -path $env:Wap_Project_Directory\PermanentSigningCert.pfx -Force

    - name: Upload Windows Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: ./ToDo-Windows.msix

  # ==========================================
  # JOB 2: BUILD & SIGN ANDROID (APK)
  # ==========================================
  build-android:
    runs-on: windows-latest
    env:
      Project_Path: ToDo.Maui.Android/ToDo.Maui.Android.csproj
      Wap_Project_Directory: ToDo.Maui.Android
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    # Calculate Semantic Version dynamically from your Git commits
    - name: Calculate Semantic Version
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Decode the Keystore
      run: |
        $keystore_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Keystore }}")
        $keystorePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath todo.keystore
        [IO.File]::WriteAllBytes("$keystorePath", $keystore_byte)

    # Pass the calculated values directly into the Android package signing properties
    - name: Publish MAUI Android App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-android -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=todo.keystore -p:AndroidSigningKeyAlias="todo_alias" -p:AndroidSigningKeyPass="${{ secrets.Pfx_Key }}" -p:AndroidSigningStorePass="${{ secrets.Pfx_Key }}" -p:SEMVER="${{ steps.nbgv.outputs.SimpleVersion }}" -p:BUILD_NUMBER=${{ steps.nbgv.outputs.GitCommitIdHeight }}

    - name: Locate and Stage Android APK
      shell: powershell
      run: |
        $apkFile = Get-ChildItem -Path "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-android/publish/*-signed.apk" -Recurse | Select-Object -First 1
        if (-not $apkFile) { throw "Could not find signed APK." }
        Copy-Item -Path $apkFile.FullName -Destination "./ToDo-Android.apk"

    - name: Remove the Keystore
      run: Remove-Item -path ${{ env.Wap_Project_Directory }}\todo.keystore -Force

    - name: Upload Android Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: android-binary
        path: ./ToDo-Android.apk

  # ==========================================
  # JOB 3: MERGE ARTIFACTS & CREATE RELEASE
  # ==========================================
  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-android]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Semantic Version for Release Tagging
      uses: dotnet/nbgv@master
      id: nbgv

    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-binary
        path: ./release-assets

    - name: Download Android Binary
      uses: actions/download-artifact@v4
      with:
        name: android-binary
        path: ./release-assets

    # Automatically tags the release using the calculated clean semantic string (e.g. v1.0.14)
    - name: Generate Automated GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.nbgv.outputs.SimpleVersion }}
        name: Build Release v${{ steps.nbgv.outputs.SimpleVersion }}
        body: |
          ### Automated Semantic Versioning Distribution
          This release contains compilation packages corresponding to commit height versioning tracking.
          
          * **Windows Installer:** `ToDo-Windows.msix`
          * **Android Installer:** `ToDo-Android.apk`
        draft: false
        prerelease: false
        files: |
          ./release-assets/ToDo-Windows-v*.msix
          ./release-assets/ToDo-Android-v*.apk
