name: Manual Production Release

on:
  workflow_dispatch: # Clean execution button with no prompt values required

permissions:
  contents: write

jobs:
  # ==========================================
  # STEP 1: CALCULATE NEXT MINOR VERSION
  # ==========================================
  calculate-version:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.bump.outputs.next }}
      build_number: ${{ github.run_number }}
    steps:
    - name: Fetch Latest Release Tag
      id: latest_tag
      uses: actions-ecosystem/action-get-latest-tag@v1
      with:
        with_initial_version: true
        initial_version: v1.0.0

    - name: Compute Next Minor Value
      id: bump
      run: |
        RAW_TAG="${{ steps.latest_tag.outputs.tag }}"
        # Strip out 'v' prefix if present
        CLEAN_TAG=${RAW_TAG#v}
        
        # Split out 1.0.42 structural parts
        MAJOR=$(echo $CLEAN_TAG | cut -d. -f1)
        MINOR=$(echo $CLEAN_TAG | cut -d. -f2)
        
        # Increments the minor tracking block by 1 and resets patch index to 0
        NEXT_MINOR=$((MINOR + 1))
        NEXT_VERSION="$MAJOR.$NEXT_MINOR.0"
        
        echo "Calculated output version target: $NEXT_VERSION"
        echo "next=$NEXT_VERSION" >> $GITHUB_OUTPUT

  # ==========================================
  # STEP 2: COMPILE WINDOWS DISTRIBUTION
  # ==========================================
  build-windows:
    runs-on: windows-latest
    needs: calculate-version
    env:
      Project_Path: ToDo.Maui.Windows/ToDo.Maui.Windows.csproj
      Wap_Project_Directory: ToDo.Maui.Windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Decode the PFX
      run: |
        $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Pfx }}")
        $certificatePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath PermanentSigningCert.pfx
        [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

    - name: Compile MAUI Windows App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-windows10.0.19041.0 -r win-x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -p:SEMVER="${{ needs.calculate-version.outputs.next_version }}" -p:BUILD_NUMBER=${{ needs.calculate-version.outputs.build_number }} -p:AppxPackageVersion="${{ needs.calculate-version.outputs.next_version }}.0"

    - name: Sign MSIX Package via SignTool
      shell: powershell
      run: |
        $msixFile = Get-ChildItem -Path "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-windows10.0.19041.0/win-x64/AppPackages/**/*.msix" -Recurse | Select-Object -First 1
        if (-not $msixFile) { throw "Could not find any compiled .msix file to sign." }
        $signTool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -First 1
        & $signTool.FullName sign /f "${{ env.Wap_Project_Directory }}\PermanentSigningCert.pfx" /p "${{ secrets.Pfx_Key }}" /fd SHA256 /v $msixFile.FullName
        Copy-Item -Path $msixFile.FullName -Destination "./ToDo-Windows-v${{ needs.calculate-version.outputs.next_version }}.msix"

    - name: Remove the PFX
      run: Remove-Item -path $env:Wap_Project_Directory\PermanentSigningCert.pfx -Force

    - name: Upload Windows Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: windows-binary
        path: ./ToDo-Windows-v${{ needs.calculate-version.outputs.next_version }}.msix

  # ==========================================
  # STEP 3: COMPILE ANDROID DISTRIBUTION
  # ==========================================
  build-android:
    runs-on: windows-latest
    needs: calculate-version
    env:
      Project_Path: ToDo.Maui.Android/ToDo.Maui.Android.csproj
      Wap_Project_Directory: ToDo.Maui.Android
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Install MAUI Workload
      run: dotnet workload install maui

    - name: Decode the Keystore
      run: |
        $keystore_byte = [System.Convert]::FromBase64String("${{ secrets.Base64_Encoded_Keystore }}")
        $keystorePath = Join-Path -Path $env:Wap_Project_Directory -ChildPath todo.keystore
        [IO.File]::WriteAllBytes("$keystorePath", $keystore_byte)

    - name: Publish MAUI Android App
      run: dotnet publish ${{ env.Project_Path }} -c Release -f net10.0-android -p:AndroidKeyStore=true -p:AndroidSigningKeyStore=todo.keystore -p:AndroidSigningKeyAlias="todo_alias" -p:AndroidSigningKeyPass="${{ secrets.Pfx_Key }}" -p:AndroidSigningStorePass="${{ secrets.Pfx_Key }}" -p:SEMVER="${{ needs.calculate-version.outputs.next_version }}" -p:BUILD_NUMBER=${{ needs.calculate-version.outputs.build_number }}

    - name: Locate and Stage Android APK
      shell: powershell
      run: |
        $apkFile = Get-ChildItem -Path "${{ env.Wap_Project_Directory }}/bin/Release/net10.0-android/publish/*-signed.apk" -Recurse | Select-Object -First 1
        if (-not $apkFile) { throw "Could not find signed APK." }
        Copy-Item -Path $apkFile.FullName -Destination "./ToDo-Android-v${{ needs.calculate-version.outputs.next_version }}.apk"

    - name: Remove the Keystore
      run: Remove-Item -path ${{ env.Wap_Project_Directory }}\todo.keystore -Force

    - name: Upload Android Staging Binary
      uses: actions/upload-artifact@v4
      with:
        name: android-binary
        path: ./ToDo-Android-v${{ needs.calculate-version.outputs.next_version }}.apk

  # ==========================================
  # STEP 4: GENERATE OFFICIAL RELEASE ENTRY
  # ==========================================
  create-release:
    runs-on: ubuntu-latest
    needs: [calculate-version, build-windows, build-android]
    steps:
    - name: Download Windows Binary
      uses: actions/download-artifact@v4
      with:
        name: windows-binary
        path: ./release-assets

    - name: Download Android Binary
      uses: actions/download-artifact@v4
      with:
        name: android-binary
        path: ./release-assets

    - name: Create Production Tag and Release Entry
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.calculate-version.outputs.next_version }}
        name: Build Release v${{ needs.calculate-version.outputs.next_version }}
        body: |
          ### Production Build Release v${{ needs.calculate-version.outputs.next_version }}
          This deployment automatically increments the Minor build value tracking index.
          
          * **Windows Platform Desktop Installer:** `ToDo-Windows-v${{ needs.calculate-version.outputs.next_version }}.msix`
          * **Android Platform Mobile Installer:** `ToDo-Android-v${{ needs.calculate-version.outputs.next_version }}.apk`
        draft: false
        prerelease: false
        files: |
          ./release-assets/ToDo-Windows-v*.msix
          ./release-assets/ToDo-Android-v*.apk